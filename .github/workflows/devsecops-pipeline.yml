name: Pipeline DevSecOps End-to-End

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # 1. SECRET SCANNING
  secret-scanning:
    name: 1. Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. SAST (Análisis Estático)
  sast:
    name: 2. SAST (Semgrep)
    needs: secret-scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar Semgrep en app/
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --config auto --error app/

  # 3. SCA (Análisis de Dependencias)
  sca:
    name: 3. SCA (Trivy Filesystem)
    needs: secret-scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escaneo de librerías con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'app/'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  # 4. IaC SECURITY
  iac-security:
    name: 4. IaC Security (Checkov)
    needs: secret-scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escaneo de IaC con Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: '.'
          framework: 'terraform,dockerfile'
          soft_fail: true

  # 5. BUILD, CONTAINER SCAN & GENERACIÓN DE SBOM
  build-and-sbom:
    name: 5. Build, Container Scan & SBOM
    needs: [sast, sca, iac-security]
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build-push.outputs.digest }}
      lower_image: ${{ steps.prep.outputs.lower_image }}
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Preparar ruta de imagen en minúsculas
        id: prep
        run: |
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "lower_image=${REGISTRY}/${LOWER_REPO}" >> $GITHUB_OUTPUT

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.lower_image }}
          tags: type=sha

      - name: Compilar y Publicar Imagen en GHCR
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Generar SBOM con Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.prep.outputs.lower_image }}:sha-${{ github.sha }}
          format: cyclonedx-json
          output-file: 'sbom.cyclonedx.json'

      - name: Publicar SBOM como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

      - name: Escaneo de Imagen Docker con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.prep.outputs.lower_image }}:sha-${{ github.sha }}
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '0'

  # 6. FIRMA CRIPTOGRÁFICA DE CONTENEDORES
  sign-container:
    name: 6. Firma de Artefacto (Cosign Keyless)
    needs: build-and-sbom
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Firmar Imagen mediante Sigstore por Digest
        run: |
          IMAGE_REF="${{ needs.build-and-sbom.outputs.lower_image }}@${{ needs.build-and-sbom.outputs.image_digest }}"
          cosign sign --yes "$IMAGE_REF"
